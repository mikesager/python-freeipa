[project]
name = "python-freeipa-alt"
version = "1.0.7"
authors = [
  { name = "Mike Sager", email = "mike@mikesager.name" },
]
description = "Lightweight FreeIPA client"
readme = "README.rst"
requires-python = ">=3.10"

dependencies = [
  "requests~=2.32",
]

classifiers = [
  'Intended Audience :: Developers',
  'License :: OSI Approved :: MIT License',
  'Operating System :: OS Independent',
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Topic :: Software Development :: Libraries',
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: System :: Systems Administration :: Authentication/Directory',
]


[project.optional-dependencies]
gssapi = ["requests-gssapi~=1.3"]
srv = ["srvlookup~=3.0"]
test = [
  "responses",
  "pytest>=8.3.4",
  "pytest-cov>=5.0.0",
]
#tests = ["responses~=0.25"]
all = [
  "requests-gssapi~=1.3",
  "srvlookup~=3.0",
]




[project.urls]
Repository = "https://gitea.g4c.thegrateful.org/sagerm/python-freeipa-alt"



[tool.black]
line-length = 88
skip-string-normalization = true



#[build-system]
#requires = ["setuptools"]
#build-backend = "setuptools.build_meta"
##build-backend = "setuptools.build_meta:__legacy__"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling configuration for package discovery
[tool.hatch.build.targets.wheel]
packages = ["src/python_freeipa"]

[tool.pytest.ini_options]
addopts = "--cov=src/python_freeipa/"
